name: Pulumi PR Comment Automation (Atlantis-style with AWS OIDC)

on:
  issue_comment:
    types: [created]

permissions:
  id-token: write    # Required for AWS OIDC authentication
  contents: read
  issues: write
  pull-requests: write

jobs:
  atlantis-comment-handler:
    name: Handle PR Comment Command
    if: github.event.issue.pull_request != null && startsWith(github.event.comment.body, '/pulumi')
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge Comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: rocket

      - name: Fetch PR Checkout Ref
        id: pr_data
        uses: xt0rted/pull-request-comment-branch@v2

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_data.outputs.head_ref }}

      # Authenticate to AWS via OIDC (Secretless)
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Pulumi CLI
        uses: pulumi/actions@v5

      - name: Parse Command and Target Stack
        id: parse_cmd
        run: |
          COMMENT="${{ github.event.comment.body }}"
          CMD=$(echo "$COMMENT" | awk '{print $2}')
          STACK=$(echo "$COMMENT" | awk '{print $3}')

          if [ -z "$STACK" ]; then
            STACK="dev"
          fi

          echo "cmd=$CMD" >> $GITHUB_OUTPUT
          echo "stack=$STACK" >> $GITHUB_OUTPUT

      - name: Auto-Create S3 State Bucket if Missing
        run: |
          STACK="${{ steps.parse_cmd.outputs.stack }}"
          AWS_REGION="${{ secrets.AWS_REGION || 'us-east-1' }}"
          
          if [ "$STACK" = "prod" ]; then
            STATE_BUCKET="${{ secrets.PULUMI_STATE_BUCKET_PROD || 'arnav-pulumi-state-prod' }}"
          else
            STATE_BUCKET="${{ secrets.PULUMI_STATE_BUCKET_DEV || 'arnav-pulumi-state-dev' }}"
          fi

          echo "Target State Bucket for $STACK: $STATE_BUCKET"
          echo "PULUMI_BACKEND_URL=s3://$STATE_BUCKET" >> $GITHUB_ENV

          if ! aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            echo "State bucket '$STATE_BUCKET' not found. Auto-creating..."
            aws s3api create-bucket --bucket "$STATE_BUCKET" --region "${AWS_REGION}"
            aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$STATE_BUCKET" --server-side-encryption-configuration '{"Rules": [{"ApplyServerSideEncryptionByDefault": {"SSEAlgorithm": "AES256"}}]}'
            echo "Successfully auto-created state bucket: $STATE_BUCKET"
          else
            echo "State bucket '$STATE_BUCKET' already exists."
          fi

      - name: Login to S3 Backend
        run: pulumi login ${PULUMI_BACKEND_URL}

      - name: Execute Pulumi Command
        id: execute_pulumi
        run: |
          CMD="${{ steps.parse_cmd.outputs.cmd }}"
          STACK="${{ steps.parse_cmd.outputs.stack }}"

          echo "Executing: $CMD on stack: $STACK"

          if [ "$CMD" = "preview" ]; then
            pulumi preview --stack $STACK --non-interactive > output.txt 2>&1
          elif [ "$CMD" = "up" ] || [ "$CMD" = "apply" ]; then
            pulumi up --stack $STACK --yes --non-interactive > output.txt 2>&1
          elif [ "$CMD" =="destroy" ]; then
            pulumi destroy --stack $STACK --yes --non-interactive > output.txt 2>&1
          else
            echo "Unknown command '$CMD'. Supported: preview, up, destroy" > output.txt
          fi

          {
            echo 'PULUMI_OUTPUT<<EOF'
            cat output.txt
            echo 'EOF'
          } >> $GITHUB_ENV

      - name: Post Result Comment to PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ### 🤖 Pulumi GitOps Bot Output (AWS OIDC Authenticated)

            **Executed Command:** `${{ github.event.comment.body }}`
            **State Backend:** `${{ env.PULUMI_BACKEND_URL }}`

            <details><summary>Click to expand execution logs</summary>

            ```text
            ${{ env.PULUMI_OUTPUT }}
            ```

            </details>
